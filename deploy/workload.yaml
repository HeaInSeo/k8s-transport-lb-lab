apiVersion: v1
kind: Namespace
metadata: {name: lb-lab, labels: {app.kubernetes.io/part-of: k8s-transport-lb-lab}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: echo, namespace: lb-lab}
spec:
  replicas: 3
  selector: {matchLabels: {app: transport-echo}}
  template:
    metadata: {labels: {app: transport-echo}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector: {matchLabels: {app: transport-echo}}
      containers:
        - name: echo
          image: LAB_IMAGE
          imagePullPolicy: Never
          args: [server]
          ports: [{name: http, containerPort: 8080}, {name: grpc, containerPort: 50051}]
          readinessProbe: {grpc: {port: 50051}, periodSeconds: 2}
          resources: {requests: {cpu: 25m, memory: 24Mi}, limits: {cpu: 500m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: echo, namespace: lb-lab}
spec:
  selector: {app: transport-echo}
  sessionAffinity: None
  internalTrafficPolicy: Cluster
  ports: [{name: http, port: 8080, targetPort: http}, {name: grpc, port: 50051, targetPort: grpc}]
---
apiVersion: v1
kind: Service
metadata: {name: echo-headless, namespace: lb-lab}
spec:
  clusterIP: None
  selector: {app: transport-echo}
  publishNotReadyAddresses: false
  ports: [{name: grpc, port: 50051, targetPort: grpc}]
